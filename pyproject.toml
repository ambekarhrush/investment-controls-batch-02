[project]
name = "investment-controls-batch"
version = "0.1.0"
description = "Point-in-time data, operational controls, stress testing, attribution and mandate monitoring"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.4", "matplotlib>=3.10", "numpy>=2.2", "pandas>=2.2", "scipy>=1.15"]

[project.optional-dependencies]
dev = ["mypy>=1.15", "pandas-stubs>=2.2", "pytest>=8.3", "ruff>=0.11"]

[project.scripts]
investment-controls = "investment_controls.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investment_controls"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "investment_controls.attribution",
  "investment_controls.catalogue",
  "investment_controls.mandate_monitoring",
  "investment_controls.payment_reconciliation",
  "investment_controls.stress_testing",
]
ignore_errors = true
